[project]
name = "agent-eval"
version = "0.1.0"
description = "AgentEval：多框架 Agent 工具调用评测体系（轻量、可复现、横向对比）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "litellm>=1.50",
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
agent-eval = "cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI/typer 惯用：Body()/Argument() 作为端点/命令参数默认值
    "BLE001",  # 评测装置鲁棒性优先：适配器/编排器对异常盲捕获并降级为兜底值或 observation
    "DTZ011",  # run 目录用本地日期命名（runs/<日期>_<group>），非时区敏感场景
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
