# 实验矩阵（§9.1）。W3 全量 6 组：3 框架 × 2 backbone，全量三域 40 任务。
# O 组依赖 openhands 适配器（W3 落地后即可运行）。
runs:
  - group: R1
    framework: react
    model: deepseek-v4-flash
    domains: [travel, shop, analytics]
    note: "ReAct × deepseek-v4-flash"
  - group: R2
    framework: react
    model: mimo-v2.5-pro
    domains: [travel, shop, analytics]
    note: "ReAct × MiMo-v2.5-Pro（消融：换模型）"
  - group: S1
    framework: smolagents
    model: deepseek-v4-flash
    domains: [travel, shop, analytics]
    note: "smolagents × deepseek-v4-flash"
  - group: S2
    framework: smolagents
    model: mimo-v2.5-pro
    domains: [travel, shop, analytics]
    note: "smolagents × MiMo-v2.5-Pro（消融）"
  - group: O1
    framework: openhands
    model: deepseek-v4-flash
    domains: [travel, shop, analytics]
    note: "OpenHands × deepseek-v4-flash"
  - group: O2
    framework: openhands
    model: mimo-v2.5-pro
    domains: [travel, shop, analytics]
    note: "OpenHands × MiMo-v2.5-Pro（W3 方案 C）"
